name: Apply scope correction

on:
  push:
    branches:
      - plan/scriptomatic-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: plan/scriptomatic-hardening
      - name: Apply compatibility-preserving corrections
        run: python3 tests/patch-scope-correction.py
      - name: Commit changes
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bash tests README.md docs
          git commit -m 'fix: preserve Scriptomatic behavior during hardening'
          git push origin HEAD:plan/scriptomatic-hardening
