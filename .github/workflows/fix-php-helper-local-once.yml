name: Fix PHP helper local once

on:
  push:
    branches:
      - plan/scriptomatic-hardening
    paths:
      - .github/workflows/fix-php-helper-local-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: plan/scriptomatic-hardening
          fetch-depth: 0
      - name: Fix strict-mode declaration ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bash/php-cli-setup.sh')
          s = p.read_text()
          old = '  local source_name="$1" dest="$2" file="$WORKDIR/scriptomatic-$source_name"\n'
          new = '  local source_name="$1" dest="$2"\n  local file="$WORKDIR/scriptomatic-$source_name"\n'
          if old not in s:
              raise SystemExit('anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          bash -n bash/php-cli-setup.sh
      - name: Commit
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bash/php-cli-setup.sh
          git commit -m 'fix(php): order helper locals safely under nounset'
          git push origin HEAD:plan/scriptomatic-hardening
