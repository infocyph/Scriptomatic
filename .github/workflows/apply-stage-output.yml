name: Apply setup progress presentation

on:
  push:
    branches:
      - plan/scriptomatic-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: plan/scriptomatic-hardening
      - name: Restore established progress output
        run: python3 tests/patch-stage-output.py
      - name: Commit changes
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bash/php-cli-setup.sh bash/node-cli-setup.sh
          git commit -m 'fix: restore setup progress presentation'
          git push origin HEAD:plan/scriptomatic-hardening
