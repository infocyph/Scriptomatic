name: Fix PHP FPM idempotence once

on:
  push:
    branches:
      - plan/scriptomatic-hardening
    paths:
      - .github/workflows/fix-php-fpm-idempotence-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: plan/scriptomatic-hardening
          fetch-depth: 0
      - name: Fix profile-specific include check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bash/php-cli-setup.sh')
          s = p.read_text()
          old = "  if ! grep -qE '^[[:space:]]*include[[:space:]]*=[[:space:]]*/usr/local/etc/php-fpm\\.domains/\\*\\.conf[[:space:]]*$' \"$fpm_conf\"; then\n    printf '\\n; Extra pool dir mounted from host\\ninclude=%s/*.conf\\n' \"$DOMAINS_DIR\" >> \"$fpm_conf\"\n  fi\n"
          new = "  if ! grep -qF -- \"include=${DOMAINS_DIR}/*.conf\" \"$fpm_conf\"; then\n    printf '\\n; Extra pool dir mounted from host\\ninclude=%s/*.conf\\n' \"$DOMAINS_DIR\" >> \"$fpm_conf\"\n  fi\n"
          if old not in s:
              raise SystemExit('FPM include anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          bash -n bash/php-cli-setup.sh
      - name: Commit
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bash/php-cli-setup.sh
          git commit -m 'fix(php): keep FPM domain include idempotent'
          git push origin HEAD:plan/scriptomatic-hardening
